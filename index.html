<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formicarium</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111317; color: #d8dde3;
        font: 14px/1.4 system-ui, sans-serif; }
      #stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
      #stage:active { cursor: grabbing; }
      #hud { position: fixed; top: 12px; left: 12px; padding: 10px 12px; border-radius: 8px;
        background: rgba(17, 19, 23, 0.82); max-width: calc(100vw - 48px); }
      #hud h1 { font-size: 16px; margin: 0 0 4px; font-weight: 600; display: flex; gap: 10px; align-items: center; }
      #hud h1 button { font-size: 13px; font-weight: 400; margin-left: auto; }
      #hud.small > :not(h1, #status, #outside) { display: none; }
      #hud p { margin: 2px 0; color: #9aa4b1; }
      #hud .row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
      #hud button { background: #262b33; color: #d8dde3; border: 1px solid #3a404a; border-radius: 5px;
        padding: 3px 9px; font: inherit; cursor: pointer; }
      #hud button[aria-pressed='true'] { background: #3d4a5c; border-color: #6d84a3; }
      #inspector { position: fixed; left: 12px; bottom: 12px; padding: 10px 12px; border-radius: 8px; width: min(340px, calc(100vw - 48px));
        background: rgba(17, 19, 23, 0.9); border: 1px solid #5a5236; }
      #inspector h2 { font-size: 15px; margin: 0 0 4px; font-weight: 600; color: #ffd36b; }
      #inspector p { margin: 3px 0; color: #c2cad4; }
      #inspector p.doing { color: #e8ecf0; }
      #inspector div { display: flex; gap: 6px; }
      #inspector button { margin-top: 8px; background: #262b33; color: #d8dde3; border: 1px solid #3a404a; border-radius: 5px;
        padding: 3px 9px; font: inherit; cursor: pointer; }
      #inspector button[aria-pressed='true'] { background: #3d4a5c; border-color: #6d84a3; }
      #history { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(900px, calc(100vw - 32px));
        max-height: calc(100vh - 32px); overflow: auto; padding: 10px 12px; border-radius: 8px; box-sizing: border-box;
        background: rgba(17, 19, 23, 0.95); border: 1px solid #3a404a; }
      #history h2 { font-size: 15px; margin: 0; font-weight: 600; flex: 1; }
      #history .bar { display: flex; gap: 8px; align-items: center; }
      #history button { background: #262b33; color: #d8dde3; border: 1px solid #3a404a; border-radius: 5px;
        padding: 3px 9px; font: inherit; cursor: pointer; }
      #graph-box { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 8px; margin-top: 8px; }
      #graph-box canvas { width: 100%; height: 190px; background: #16191e; border-radius: 5px; }
      #lapse { display: block; width: 100%; max-height: 60vh; object-fit: contain; image-rendering: pixelated; margin: 8px 0; }
      [hidden] { display: none !important; }
      #lapse-at { flex: 1; }
      #away { position: fixed; right: 12px; bottom: 12px; padding: 10px 12px; border-radius: 8px; width: min(360px, calc(100vw - 48px));
        background: rgba(17, 19, 23, 0.9); border: 1px solid #3a404a; }
      #away h2 { font-size: 15px; margin: 0 0 6px; font-weight: 600; }
      #away p { margin: 3px 0; color: #c2cad4; }
      #away button { margin-top: 8px; background: #262b33; color: #d8dde3; border: 1px solid #3a404a; border-radius: 5px;
        padding: 3px 9px; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hud">
      <h1>Formicarium <button id="hud-toggle" aria-expanded="true">Hide controls</button></h1>
      <p id="status">Setting up the tank…</p>
      <p id="counts"></p>
      <p id="outside"></p>
      <p>Tap an ant to inspect and follow it. Tap the arena floor to put down a drop of sugar water. Drag to move, scroll or pinch to zoom.</p>
      <div class="row">
        <button data-sugar="1" aria-pressed="true">Rich sugar (1 M)</button>
        <button data-sugar="0.1">Weak sugar (0.1 M)</button>
        <button data-sugar="protein">Insect (protein)</button>
        <button id="clear">Clear food</button>
        <button id="clean">Clean arena</button>
        <button id="trails" aria-pressed="true">Show trails</button>
        <button id="from-above" aria-pressed="false">Arena from above</button>
      </div>
      <div class="row">
        <span style="align-self: center; color: #9aa4b1">Heat mat:</span>
        <button data-mat="off">Off</button>
        <button data-mat="10">Left</button>
        <button data-mat="110" aria-pressed="true">Middle</button>
        <button data-mat="210">Right</button>
        <button id="warmth">Show warmth</button>
      </div>
      <div class="row">
        <button id="damp">Show damp</button>
        <span style="align-self: center; color: #9aa4b1">Soil darkens when damp; the farm waters itself and never dries.</span>
      </div>
      <div class="row">
        <button data-speed="0">Pause</button>
        <button data-speed="1" aria-pressed="true">1×</button>
        <button data-speed="4">4×</button>
        <button data-speed="16">16×</button>
        <button data-speed="64">64×</button>
        <button id="fit">Fit view</button>
        <button id="new-tank">New tank</button>
      </div>
      <div class="row">
        <button id="graphs">Colony graphs</button>
        <button id="timelapse">Timelapse of the nest</button>
      </div>
    </div>
    <div id="away" hidden></div>
    <div id="inspector" hidden></div>
    <div id="history" hidden>
      <div class="bar"><h2 id="history-title"></h2><button id="to-graphs">Graphs</button><button id="to-lapse">Timelapse</button><button id="history-close">Close</button></div>
      <div id="graph-box">
        <canvas></canvas><canvas></canvas><canvas></canvas><canvas></canvas>
      </div>
      <div id="lapse-box">
        <canvas id="lapse"></canvas>
        <div class="bar">
          <button id="lapse-play">Play</button>
          <input id="lapse-at" type="range" min="0" max="0" value="0" />
          <span id="lapse-label"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
